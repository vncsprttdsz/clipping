name: Testes

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      # Os testes são offline (sessão HTTP falsa), então não dependem do FNET.
      - run: python -m unittest discover -s tests -v
