name: Clipping diário
# Objetivo: ter o clipping pronto ANTES das 06:30 BRT (09:30 UTC).
#
# O agendamento do GitHub Actions e best-effort e neste repo atrasa MUITO.
# Atraso medido em 12 dias (ago/2026), do horario do cron ate o disparo real:
#   dias bons  08-13/ago e 26/ago : 34 a 110 min
#   dias ruins 27-31/ago          : 307 a 750 min (5 a 12 HORAS)
# Repo publico no plano Free tem a menor prioridade na fila de runners, e nao
# ha o que fazer quanto a isso do lado do cron.
#
# Duas consequencias que moldam esta grade:
#
# 1. O atraso e CORRELACIONADO dentro do dia: em 28/ago os 5 slots vieram
#    todos 11-12h atrasados. Empilhar crons numa janela de 5h nao cria
#    redundancia, todos falham juntos. Redundancia real so vem de espalhar
#    ao longo da noite, comecando na vespera.
#
# 2. Todo cron precisa caber em: disparo + atraso + duracao <= 09:30 UTC.
#    Com duracao p90 de 18 min, cada horario tolera um atraso maximo:
#      22:13 UTC -> 11h    05:23 UTC -> 3,8h    07:53 UTC -> 1,3h
#      01:23 UTC -> 7,8h   06:43 UTC -> 2,5h    08:23 UTC -> 0,8h
#      03:23 UTC -> 5,8h   07:23 UTC -> 1,8h
#    O cron antigo das 09:17 UTC (06:17 BRT) era IMPOSSIVEL: mesmo com atraso
#    zero terminaria 09:35, depois do deadline. Removido.
#
# Cobertura desta grade nos 12 dias medidos: 11/12 entregam alguma coisa,
# 7/12 entregam a madrugada. Os 4 slots da vespera existem para o caso ruim,
# quando so eles chegam a tempo.

on:
  schedule:
    # Horários em UTC. BRT = UTC-3 (sem horário de verão desde 2019).
    # Minutos quebrados evitam os picos de fila de :00, :15, :30 e :45.

    # --- rede de seguranca: dispara na vespera, sobrevive a atraso de horas
    - cron: '13 22 * * *'  # 19:13 BRT (D-1)  tolera ate 11h de atraso
    - cron: '23 1 * * *'   # 22:23 BRT (D-1)  tolera ate 7,8h
    - cron: '23 3 * * *'   # 00:23 BRT        tolera ate 5,8h

    # --- cobrem a madrugada, que e a noticia que interessa
    - cron: '23 5 * * *'   # 02:23 BRT        tolera ate 3,8h
    - cron: '43 6 * * *'   # 03:43 BRT        tolera ate 2,5h
    - cron: '23 7 * * *'   # 04:23 BRT        tolera ate 1,8h
    - cron: '53 7 * * *'   # 04:53 BRT        tolera ate 1,3h

    # --- best effort: so chega em dia bom, mas e o mais fresco possivel
    - cron: '23 8 * * *'   # 05:23 BRT        tolera ate 50 min
  # Botão "Run workflow" manual (útil pra testar ou re-scorear)
  workflow_dispatch:
    inputs:
      rescore:
        description: 'Re-aplicar matching em todos os artigos existentes (use depois de mudar keywords.yaml)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Serializa runs - se um começar enquanto outro ainda roda, espera a vez.
# cancel-in-progress: false garante que nenhum run seja morto no meio.
concurrency:
  group: clipping-daily
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 permite rebase limpo se precisarmos
          fetch-depth: 0

      - name: Instala Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instala dependências
        run: pip install feedparser requests beautifulsoup4 pyyaml

      - name: Roda o clipping com rescore
        if: ${{ inputs.rescore }}
        run: python clipping.py --output-json data/articles.json --since 48 --rescore --probe-experimental

      - name: Roda o clipping normal
        if: ${{ !inputs.rescore }}
        run: python clipping.py --output-json data/articles.json --since 48 --probe-experimental

      - name: Commita o resultado (se houver mudanças)
        run: |
          git config user.name "clipping-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          if git diff --staged --quiet; then
            echo "Sem novidades."
          else
            # Pull com rebase antes do push protege contra caso extremo
            # de runs concorrentes (mesmo com concurrency group).
            git commit -m "Clipping $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || true
            git push
          fi
