name: Clipping diário
# Objetivo: clipping pronto ANTES das 06:30 BRT (09:30 UTC).
#
# DISPARO PRINCIPAL: cron-job.org, todo dia as 05:45 e as 06:07 BRT, via
# workflow_dispatch (POST na API do GitHub com token de Actions). Dispatch
# roda na hora; em 18 dias medidos (13-30/out) disparou as 06:07 em todos.
# O das 05:45 deixa o clipping pronto para quem olha as 06:00; o das 06:07
# pega o que os portais publicam ate perto das 06:30.
#
# RESERVA: tres crons do GitHub + ancora. O agendador do GitHub e
# best-effort e neste repo atrasa de 30 min a 7h, com regime que muda de
# semana para semana. Por isso o cron nao decide a hora: o job "ancora"
# segura o run ate 06:15 BRT e so entao o scrape roda. Os tres slots, a 1h
# de distancia, garantem que pelo menos um caia na janela da ancora (03:45 a
# 09:15 UTC) com atraso entre ~25 min e ~6h. Se o cron-job.org falhar ou o
# token expirar, a reserva entrega sozinha as ~06:18 BRT.
#
# Ate out/2026 eram 16 crons espalhados de 19:13 a 05:41 BRT para cercar
# o atraso. Com o dispatch externo eles so geravam runs cancelados (3 a 8
# por dia) e refresh em horario imprevisivel. Para atualizar durante o
# dia, crie outro job no cron-job.org no horario exato desejado.

on:
  schedule:
    # Horarios em UTC. BRT = UTC-3. Minutos quebrados evitam os picos de :00.
    - cron: '23 1 * * *'   # 22:23 BRT (D-1)
    - cron: '23 2 * * *'   # 23:23 BRT (D-1)
    - cron: '23 3 * * *'   # 00:23 BRT
  # Disparos do cron-job.org (05:45 e 06:07 BRT) e o botao "Run workflow" manual.
  workflow_dispatch:
    inputs:
      rescore:
        description: 'Re-aplicar matching em todos os artigos existentes (use depois de mudar keywords.yaml)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ANCORA, so em schedule: o cron so precisa acordar o runner em algum
  # momento da janela; o job dorme ate o alvo.
  #
  # E um job separado, SEM concurrency, de proposito. Quando a espera ficava
  # dentro do job de scrape, o run dormindo segurava o grupo de concorrencia
  # por horas: o disparo das 06:07 ficava na fila atras dele e, se outro
  # cron chegasse nesse meio tempo, o GitHub cancelava o disparo (5 de 18
  # dias em out/2026). Agora so o scrape disputa o grupo.
  ancora:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    # Espera ate 330 min. O teto do GitHub e 360 min por job.
    timeout-minutes: 345
    steps:
      - name: Espera ate 06:15 BRT
        run: |
          ALVO="09:15"   # 06:15 BRT: depois do dispatch das 06:07, que fica pronto ~06:10
          JANELA=19800   # so espera se o alvo estiver a no maximo 330 min
          # Registra qual cron gerou o run, para medir o atraso de cada slot.
          echo "Cron: ${{ github.event.schedule }}"
          alvo=$(date -u -d "today $ALVO" +%s)
          agora=$(date -u +%s)
          espera=$(( alvo - agora ))
          if [ "$espera" -gt 0 ] && [ "$espera" -le "$JANELA" ]; then
            echo "Iniciou $(date -u +%H:%M) UTC. Dormindo $((espera/60)) min ate $ALVO UTC (06:15 BRT)."
            sleep "$espera"
            echo "Acordou $(date -u +%H:%M) UTC."
          else
            echo "Sem espera: alvo esta a $((espera/60)) min. Rodando agora, $(date -u +%H:%M) UTC."
          fi

  scrape:
    needs: ancora
    # Roda tambem quando a ancora e pulada (dispatch) ou falha (runner
    # perdido no meio da espera): melhor publicar fora de hora que nao
    # publicar. So nao roda se o run foi cancelado.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serializa os scrapes: se um comecar enquanto outro roda, espera a vez.
    concurrency:
      group: clipping-daily
      cancel-in-progress: false

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instala Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instala dependências
        run: pip install feedparser requests beautifulsoup4 pyyaml

      - name: Roda o clipping com rescore
        if: ${{ inputs.rescore }}
        run: python clipping.py --output-json data/articles.json --since 48 --rescore --probe-experimental

      - name: Roda o clipping normal
        if: ${{ !inputs.rescore }}
        run: python clipping.py --output-json data/articles.json --since 48 --probe-experimental

      - name: Commita o resultado (se houver mudanças)
        run: |
          git config user.name "clipping-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/articles.json
          if git diff --staged --quiet; then
            echo "Sem novidades."
            exit 0
          fi

          # Corrida de runs concorrentes.
          #
          # A versao antiga fazia "git pull --rebase origin main || true" e
          # depois push. Quando o outro run ja tinha publicado, o rebase dava
          # CONFLICT em data/articles.json, o "|| true" engolia o erro e o
          # push rodava com o repo em rebase pela metade, em detached HEAD:
          #   fatal: You are not currently on a branch  -> exit 128
          # Foi o que derrubou o run 797 em 04/set. Continua possivel: o
          # dispatch das 06:07 e a reserva das 06:15 publicam com minutos de
          # diferenca, partindo de bases diferentes.
          #
          # Rebase e a ferramenta errada aqui. data/articles.json e ARTEFATO
          # GERADO, nao codigo: nao existe "juntar as duas versoes", existe
          # decidir qual publicar. Politica: a nossa vence, porque foi gerada
          # depois e o proprio clipping.py ja faz merge incremental com a
          # base. Reaplicamos o arquivo sobre o main mais novo e publicamos.
          ARQ="$RUNNER_TEMP/gerado.json"
          cp data/articles.json "$ARQ"

          for tentativa in 1 2 3; do
            git commit -q -m "Clipping $(date -u +'%Y-%m-%d %H:%M UTC')"

            if git push origin HEAD:main; then
              echo "Publicado na tentativa $tentativa."
              exit 0
            fi

            echo "Push rejeitado: outro run publicou antes. Reaplicando sobre o main mais novo."
            git fetch origin main
            git reset --hard origin/main
            cp "$ARQ" data/articles.json
            git add data/articles.json

            if git diff --staged --quiet; then
              echo "O run concorrente publicou conteudo equivalente. Nada a fazer."
              exit 0
            fi
          done

          echo "Nao foi possivel publicar apos 3 tentativas."
          exit 1
