    # H&M abriu operacao BR: so existia em Global Consumer com gate em ingles,
    # entao "H&M vai abrir mais quatro lojas no Brasil" nao casava em lugar nenhum.
    - h&m
    - chilli beans
    - marabraz

    # Tickers. A imprensa de mercado (InfoMoney, Money Times, Suno) escreve
    # manchete ticker-first ("LREN3 sobe 4% apos balanco"), sem citar a marca.
    # Antes daqui, "lren"/"ceab" estavam truncados e eram codigo morto: \b nao
    # separa letra de digito, entao \blren\b nunca casa "LREN3".
    - lren3
    - ceab3
    - riaa3
    - azza3
    - guar3
    - amar3

