    - alias: farm
      requires_any: [loja, marca, moda, vestuário, coleção, azzas, grupo, rio]
    - alias: reserva
      requires_any: [loja, marca, moda, vestuário, azzas, coleção, collection]
      requires_none: [tesouro reserva, reserva monetária, reserva financeira,
                      reserva de emergência, reserva técnica, caixinha,
                      reservas internacionais, reserva legal,
                      reserva indígena, reserva ambiental, reserva florestal]
