    # Ambíguos
    # gold/silver: "price", "fed", "inflation" e "commodity" abriam para
    # qualquer materia de preco de ouro. Entravam 11 artigos de macro de
    # commodity por janela ("Gold Drops; Focus on Fed July Minutes",
    # "Gold Above $4,600 on Weaker Dollar"), sem leitura de consumo nem de
    # joalheria. Mantido so o contexto de joia/materia-prima de luxo, que
    # preserva o caso legitimo (custo de insumo pra Vivara e pares).
    - alias: gold
      requires_any: [jewelry, jeweler, luxury, watch, watches, tiffany,
                     cartier, richemont, vivara, joalheria]
      requires_none: [medal, medalha, olimpiadas, olympic]
    - alias: silver
      requires_any: [jewelry, jeweler, luxury, watch, watches, tiffany,
                     cartier, richemont, vivara, joalheria]
      requires_none: [medal, medalha, olimpiadas, olympic]
    - alias: jewelry
      requires_any: [luxury, market, sales, brand, demand, price]
    # Roche e Pfizer sao pharma pura num clipping de consumo. Como alias
    # simples, Roche trouxe 8 artigos por janela (Elevidys, Alzheimer, doenca
    # rara) e Pfizer 1 falso positivo ("Comece pela tese de inovacao", menção
    # incidental no lead). So interessam pelo angulo de obesidade/GLP-1.
    - alias: roche
      requires_any: [obesity, obesidade, glp-1, glp1, weight loss, emagrec,
                     consumer health, otc, dermocosmetic, genentech obesity]
    - alias: pfizer
      requires_any: [obesity, obesidade, glp-1, glp1, weight loss, emagrec,
                     consumer health, otc, danuglipron]
